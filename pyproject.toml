[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mit-ssa-harness"
version = "0.2.0"
description = "Auditable forecasting harness for Social Simulation Arena"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
server = ["cryptography>=41"]

[project.scripts]
ssa-harness = "ssa_harness.cli:main"
ssa-retrieval = "ssa_harness.retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ssa_harness.retrieval" = ["examples/*.json"]
"ssa_harness" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
